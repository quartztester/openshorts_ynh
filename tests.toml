#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/tests.v1.schema.json

test_format = 1.0

[default]
    # App is root-only: absolute URLs internally + change_url guard dies
    # on subpath moves, and the port-clash bug makes multi-instance flaky
    # upstream — keep to the single-instance path CI can rely on.
    exclude = ["install.subdir", "change_url"]
