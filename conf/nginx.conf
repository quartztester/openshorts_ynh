# OpenShorts: static dashboard from disk, everything else proxied.
# Root-path-only install (enforced in scripts/install), so no path juggling:
# the SPA routes through hash URLs and never deep-links paths that need an
# index.html fallback; unknown paths go to the backend, which serves the
# gallery/video pages and returns real 404s.

location = __PATH__/ {
    # Uploads are whole videos: raise the domain default (20M) here.
    client_max_body_size 2048M;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # YunoHost SSO gate: the app has its own media token scheme; never leak
    # SSO basic creds into it.
    proxy_set_header Authorization "";
}

# Long renders stream progress over one request; keep them alive.
location __PATH__/api/ {
    client_max_body_size 2048M;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
}

# MCP endpoint for agents (SSE-capable).
location __PATH__/mcp {
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Rendered clip bytes (backend StaticFiles with per-job guards).
location __PATH__/videos/ {
    proxy_buffering off;
    # Range requests on large mp4s must not be swallowed by a 60 s read timeout.
    proxy_read_timeout 600s;
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location __PATH__/thumbnails/ {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Remotion render service: loopback only, reached by the backend AND by the
# dashboard's /render/ calls (it serves its own /output static for sources).
location __PATH__/render/ {
    client_max_body_size 16M;
    proxy_read_timeout 3600s;
    proxy_pass http://127.0.0.1:__PORT_RENDER__/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location __PATH__/output/ {
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_pass http://127.0.0.1:__PORT_RENDER__/output/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# Static dashboard: hashed assets cache forever, index.html never.
location __PATH__/assets/ {
    alias __INSTALL_DIR__/dashboard/dist/assets/;
    expires 1y;
    more_set_headers "Cache-Control: public, immutable";
}

location __PATH__/ {
    alias __INSTALL_DIR__/dashboard/dist/;
    index index.html;
    absolute_redirect off;
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "X-Frame-Options: SAMEORIGIN";
    # SEO pages from vite-plugin-seo are .html files resolved below; anything
    # still unresolved goes to the backend (gallery, /video/<id>, free tools).
    try_files $uri $uri.html @openshorts___APP__;
}

location @openshorts___APP__ {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
